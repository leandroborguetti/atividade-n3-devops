apiVersion: apps/v1
kind: Deployment
metadata:
  name: loja-api
  namespace: n3-leandro
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loja-api
  template:
    metadata:
      labels:
        app: loja-api
    spec:
      containers:
        - name: loja-api
          image: loja-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: loja-api-config
            - secretRef:
                name: loja-db-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: loja-api
  namespace: n3-leandro
spec:
  type: NodePort
  selector:
    app: loja-api
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
